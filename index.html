<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brayden's Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #020617;
      border-radius: 16px;
      padding: 24px 20px 20px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid #1f2937;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    p {
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input[type="password"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
    }

      outline: 2px solid #22c55e;
      outline-offset: 1px;
      border-color: transparent;
    }
